<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <link rel="icon" href="data:,">
  <title>Document reader · Fundamental Research Desk</title>
  <link rel="stylesheet" href="viewer.css">
</head>
<body>
  <header class="reader-header">
    <a class="brand" href="index.html" target="_top"><span class="brand-mark">F</span><span>Fundamental Research Desk<span class="brand-caption">SOURCE DOCUMENT</span></span></a>
    <a class="back-link" href="index.html" target="_top">Back to research desk <span aria-hidden="true">↗</span></a>
  </header>
  <main class="reader">
    <div class="document-heading"><div class="document-heading-copy"><span class="eyebrow">DOCUMENT READER</span><h1 id="document-title">Opening document…</h1></div><a id="original" class="original-link" hidden target="_blank" rel="noopener">Original PDF <span aria-hidden="true">↗</span></a></div>
    <div class="toolbar" role="toolbar" aria-label="Document controls">
      <div class="page-controls">
        <button id="previous" class="icon-button" aria-label="Previous page" title="Previous page" disabled>←</button>
        <label for="page-number">Page</label><input id="page-number" type="number" min="1" value="1" inputmode="numeric" aria-label="Physical PDF page number" disabled><span class="page-total">of <span id="page-count">—</span></span>
        <button id="next" class="icon-button" aria-label="Next page" title="Next page" disabled>→</button>
      </div>
      <div class="zoom-controls">
        <button id="zoom-out" class="icon-button" aria-label="Zoom out" title="Zoom out" disabled>−</button><span id="zoom-value" aria-live="off">Fit</span><button id="zoom-in" class="icon-button" aria-label="Zoom in" title="Zoom in" disabled>+</button><button id="fit" title="Fit document to available width" disabled>Fit width</button>
      </div>
      <button id="find-toggle" class="find-toggle" aria-expanded="false" aria-controls="find-bar" disabled><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5"/><path d="m12.6 12.6 4 4"/></svg><span>Find</span></button>
    </div>
    <form id="find-bar" class="find-bar" hidden role="search" aria-label="Search in this PDF">
      <label class="sr-only" for="find-input">Search document text</label><input id="find-input" type="search" placeholder="Find text in this document" autocomplete="off"><button type="submit" id="find-submit">Find</button><button type="button" id="find-next" disabled>Next page</button><span id="find-status" role="status"></span>
    </form>
    <div id="viewport" class="viewport" tabindex="0" aria-label="PDF document page">
      <div id="loading" class="loading" role="status"><span class="spinner" aria-hidden="true"></span><span id="loading-text">Opening source document…</span></div>
      <div id="error" class="error" hidden role="alert"><span class="eyebrow">DOCUMENT UNAVAILABLE</span><h2>We couldn’t open this page.</h2><p id="error-message"></p><a id="error-original" class="primary-link" hidden target="_blank" rel="noopener">Open the original PDF ↗</a></div>
      <div id="page" class="pdf-page" hidden><canvas id="canvas" aria-hidden="true"></canvas><div id="text-layer" class="textLayer" role="document" aria-label="Selectable document text"></div></div>
    </div>
    <footer class="reader-footer"><span id="page-status" role="status">Pages are displayed as published.</span><span>Page numbers refer to PDF pages.</span></footer>
  </main>
  <script type="module" src="viewer.js"></script>
</body>
</html>
